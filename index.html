<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Smart Workout Coach</title><style>:root{--b:#07111f;--c:#102036;--t:#f7fbff;--m:#9db0c7;--g:#b7f34b;--y:#43d6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17314c,var(--b) 50%);color:var(--t);font:16px system-ui}main{max-width:920px;margin:auto;padding:24px 16px}.card{background:#102036ef;border:1px solid #29425d;border-radius:20px;padding:18px;margin:14px 0}h1{font-size:clamp(30px,7vw,52px);margin-bottom:4px}.muted,small{color:var(--m)}input{width:100%;padding:20px;border:1px dashed var(--y);border-radius:14px;background:#081524;color:white}button{border:0;border-radius:13px;padding:14px;font-weight:800;background:var(--g);color:#102000;cursor:pointer;flex:1}.secondary{background:#263e58;color:white}.danger{background:#ff6678}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{min-width:130px}#timer{text-align:center;font-size:clamp(70px,22vw,150px);font-weight:900;color:var(--g);font-variant-numeric:tabular-nums}#phase,#name,#detail{text-align:center}#phase{color:var(--y);letter-spacing:.18em;text-transform:uppercase}#name{font-size:clamp(25px,7vw,44px)}li{padding:9px;border-bottom:1px solid #29425d}.active{background:#19334e;color:var(--g);border-radius:9px}.hidden{display:none}.progress{height:10px;background:#07111f;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--g));width:0}@media(max-width:520px){button{width:100%}}</style></head><body><main><h1>Smart Workout Coach</h1><p class="muted">Import a workout JSON file and start hands-free coaching.</p><section class="card"><h2>1. Import JSON</h2><input id="file" type="file" accept=".json,application/json"><p class="muted">Expected: workout_routine → sections → exercises. Supports time, timing, prescribed_sets_and_reps and visual_guide.</p><div class="row"><button id="load">Load workout</button><button id="sample" class="secondary">Load attached example</button></div><pre id="status" class="muted"></pre></section><section class="card"><h2>2. Workout plan</h2><div id="summary" class="muted">No workout loaded.</div><ol id="plan"></ol></section><section id="coach" class="card hidden"><div id="phase">Ready</div><div id="name">Workout</div><div id="timer">00:00</div><div class="progress"><i id="bar"></i></div><p id="detail" class="muted"></p><div class="row"><button id="start">Start</button><button id="done" class="secondary hidden">Set complete</button><button id="pause" class="secondary">Pause</button><button id="skip" class="secondary">Skip</button><button id="reset" class="danger">Reset</button></div></section></main><script>
const $=s=>document.querySelector(s);let data,work=[],steps=[],i=0,clock,guideClock,left=0,total=0,running=false,paused=false;
const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`, toSec=t=>{let m=String(t).match(/(\d+):(\d\d)/);return m?+m[1]*60+ +m[2]:0},range=t=>{let a=String(t||'').split(/[–—-]/).map(toSec);return a.length>1?Math.max(0,a[1]-a[0]):0};
function speech(t,cut=false){if(!t)return;if(cut)speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u)}function bell(f=900){let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.15;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.stop(a.currentTime+.25)}
function guide(v){return typeof v==='string'?v:v?[v.start,v.action,...Object.entries(v).filter(([k])=>!['start','action'].includes(k)).map(x=>x[1])].filter(Boolean).join(' '):''}function timing(v){let s=String(v||''),a=s.match(/(\d+)\s*s\s*(exercise|active|hold)/i),r=s.match(/(\d+)\s*s\s*rest/i);return{a:a?+a[1]:0,r:r?+r[1]:0}}
function normalize(j){let out=[];(j?.workout_routine?.sections||j?.sections||[]).forEach(sec=>(sec.exercises||[]).forEach(e=>{let t=timing(e.timing),p=String(e.prescribed_sets_and_reps||e.reps||''),sm=p.match(/(\d+)\s*sets?/i),cm=p.match(/[×x]\s*(\d+)/),sets=sm?+sm[1]:1,dur=t.a||(!t.r?range(e.time):0),type=dur?'time':'count',amount=dur||(cm?+cm[1]:range(e.time)||30);out.push({section:sec.title||'',name:e.name||'Exercise',sets,rest:t.r,type,amount,visual:guide(e.visual_guide),time:e.time||'',prescription:p})}));return out}
function build(j){work=normalize(j);steps=[];work.forEach((e,ei)=>{for(let s=1;s<=e.sets;s++){steps.push({...e,kind:'work',set:s});if(e.rest&&(s<e.sets||ei<work.length-1))steps.push({kind:'rest',amount:e.rest,name:e.name,next:s<e.sets?e.name:work[ei+1]?.name})}});$('#coach').classList.toggle('hidden',!steps.length);$('#summary').textContent=`${work.length} exercises • ${work.reduce((a,x)=>a+x.sets,0)} sets • timed work ${fmt(work.filter(x=>x.type==='time').reduce((a,x)=>a+x.amount*x.sets,0))} • rest ${fmt(steps.filter(x=>x.kind==='rest').reduce((a,x)=>a+x.amount,0))}`;$('#plan').innerHTML=work.map((e,n)=>`<li data-n="${n}"><b>${e.name}</b> — ${e.sets} set(s) × ${e.type==='time'?fmt(e.amount):(e.prescription||e.amount+' reps')}, rest ${fmt(e.rest)}${e.time?' • '+e.time:''}<br><small>${e.visual}</small></li>`).join('');i=0;ready();$('#status').textContent=work.length?`Loaded ${work.length} exercises.`:'No exercises found.'}
function stopClocks(){clearInterval(clock);clearTimeout(guideClock)}function mark(s){document.querySelectorAll('li').forEach(x=>x.classList.remove('active'));if(s.name){let n=work.findIndex(x=>x.name===s.name);document.querySelector(`[data-n="${n}"]`)?.classList.add('active')}}function ready(){stopClocks();running=paused=false;if(!steps.length)return;let s=steps[i];$('#phase').textContent='Ready';$('#name').textContent=s.kind==='work'?s.name:'Rest';$('#timer').textContent=s.kind==='work'&&s.type==='count'?s.amount+' reps':fmt(s.amount);$('#detail').textContent=s.kind==='work'?`Set ${s.set} of ${s.sets}`:`Next: ${s.next}`;$('#done').classList.toggle('hidden',!(s.kind==='work'&&s.type==='count'));mark(s)}
function begin(resume=false){if(i>=steps.length)return finish();let s=steps[i];running=true;paused=false;$('#pause').textContent='Pause';if(!resume){left=total=s.amount;bell(s.kind==='work'?1046:620);if(s.kind==='work'){speech(`Start ${s.name}. Set ${s.set} of ${s.sets}`,true);guideClock=setTimeout(()=>speech(`Visual guide. ${s.visual}`),2000)}else speech(`Start rest after ${s.name}. Next exercise is ${s.next}`,true)}$('#phase').textContent=s.kind==='work'?'Exercise':'Rest';$('#name').textContent=s.kind==='work'?s.name:'Recover';$('#detail').textContent=s.kind==='work'?`Set ${s.set} of ${s.sets}`:`Next: ${s.next}`;mark(s);if(s.kind==='work'&&s.type==='count'){$('#timer').textContent=s.amount+' reps';$('#done').classList.remove('hidden');return}$('#done').classList.add('hidden');tick();clock=setInterval(tick,1000)}
function tick(){let s=steps[i];$('#timer').textContent=fmt(Math.max(0,left));$('#bar').style.width=`${100*(total-left)/total}%`;if([5,4,3,2,1].includes(left))speech(String(left));if(left--<=0){stopClocks();bell(330);speech(s.kind==='work'?`Stop ${s.name}`:'Rest complete',true);setTimeout(next,650)}}function next(){stopClocks();i++;i>=steps.length?finish():begin()}function finish(){stopClocks();running=false;$('#phase').textContent='Complete';$('#name').textContent='Great work!';$('#timer').textContent='✓';$('#bar').style.width='100%';speech('Workout complete. Great work!',true)}
$('#file').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());$('#status').textContent='Selected: '+e.target.files[0].name}catch(x){data=null;$('#status').textContent='Invalid JSON: '+x.message}};$('#load').onclick=()=>data?build(data):$('#status').textContent='Choose a valid JSON file first.';$('#sample').onclick=async()=>{try{data=await fetch('sample-workout.json').then(r=>r.json());build(data)}catch(e){$('#status').textContent='Could not load sample.'}};$('#start').onclick=()=>{if(!steps.length)return $('#status').textContent='Load a workout first.';if(!running)begin(paused)};$('#done').onclick=()=>{bell(330);speech(`Set complete. ${steps[i].name}`,true);next()};$('#pause').onclick=()=>{if(running){stopClocks();running=false;paused=true;$('#pause').textContent='Resume';speechSynthesis.cancel()}else if(paused)begin(true)};$('#skip').onclick=next;$('#reset').onclick=()=>{i=0;ready()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
