<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Smart Workout Coach</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:16px system-ui}main{max-width:920px;margin:auto;padding:16px}.card{background:#102036;border:1px solid #29425d;border-radius:18px;padding:17px;margin:13px 0}textarea{width:100%;min-height:150px;padding:12px;background:#07111f;color:#fff;border:1px solid #456;border-radius:10px;font:13px monospace}.buttons{display:grid;gap:8px;margin-top:10px}.primary-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.upload-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file-button{position:relative;overflow:hidden}.file-button input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}button,.file-button{padding:13px;border:0;border-radius:10px;background:#b7f34b;color:#102000;font-weight:800;text-align:center;cursor:pointer}.secondary{background:#29435f;color:#fff}.plan-section{margin:10px 0;padding:10px 12px;background:#0a192a;border-radius:12px}.plan-section h3{font-size:14px;margin:0 0 7px;color:#43d6ff;font-weight:600}.plan-section ul{margin:0;padding-left:22px}.plan-section li{font-size:12px;font-weight:400;padding:3px 0;color:#dbe7f4}.set-block{margin:6px 0 6px 10px}.set-title{font-size:12px;color:#a8bbd0}.hidden{display:none}#timer{text-align:center;font-size:clamp(72px,21vw,145px);font-weight:900;color:#b7f34b}#phase,#name,#detail{text-align:center}.control-row{display:grid;gap:9px;margin-top:9px}.top-controls{grid-template-columns:1fr 1fr}.bottom-controls{grid-template-columns:1fr 1fr 1fr}.done{background:#ff9f43}.skip,.pause{background:#29435f;color:#fff}.start{background:#58d26f}.reset{background:#ff9a9f}.finish{width:100%;margin-top:9px}.active{color:#b7f34b!important}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{padding:8px}.completed{background:#b7f34b;color:#07111f;border-radius:8px}@media(max-width:560px){.primary-row{grid-template-columns:1fr 1fr 1fr}.buttons button,.file-button{font-size:12px;padding:12px 5px}}</style></head><body><main><h1>Smart Workout Coach</h1><section class="card"><h2>Workout JSON</h2><textarea id="jsonPaste" placeholder="Paste workout JSON here"></textarea><div class="buttons"><div class="primary-row"><button id="planJson">Plan JSON</button><button id="download" class="secondary">Download</button><button id="sample" class="secondary">Sample</button></div><div class="upload-row"><label class="file-button secondary">Upload JSON<input id="jsonFile" type="file" accept="application/json,.json"></label><button id="planUpload">Plan Upload</button></div></div><p id="status"></p></section><section class="card"><h2 id="program">Workout Plan</h2><p id="summary"></p><div id="plan"></div></section><section id="coach" class="card hidden"><h3 id="phase"></h3><h2 id="name"></h2><div id="timer">00:00</div><p id="detail"></p><div class="control-row top-controls"><button id="done" class="done hidden">Done</button><button id="skip" class="skip">Skip</button></div><div class="control-row bottom-controls"><button id="start" class="start">Start</button><button id="pause" class="pause">Pause</button><button id="reset" class="reset">Reset</button></div><button id="finish" class="finish hidden">Finish workout</button></section><section class="card"><h2 id="month"></h2><div id="calendar" class="cal"></div></section></main><script src="app.js"></script></body></html>
