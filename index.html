<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Smart Workout Coach</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:16px system-ui}main{max-width:950px;margin:auto;padding:18px}.card{background:#102036;border:1px solid #29425d;border-radius:18px;padding:16px;margin:14px 0}textarea,input{width:100%;padding:14px;margin:6px 0;background:#07111f;color:#fff;border:1px solid #38516d;border-radius:10px}textarea{height:180px}button{padding:12px;border:0;border-radius:10px;background:#b7f34b;font-weight:800;margin:4px}.coach{display:grid;grid-template-columns:1fr 38%;gap:15px;align-items:center}#timer{font-size:clamp(65px,18vw,130px);font-weight:900;color:#b7f34b;text-align:center}#name,#phase{text-align:center}#media img,#media video{width:100%;max-height:400px;object-fit:contain;border-radius:14px}.hidden,#media:empty{display:none}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{padding:8px}.done{background:#b7f34b;color:#07111f;border-radius:8px}@media(max-width:650px){.coach{grid-template-columns:1fr}}</style><main><h1>Smart Workout Coach</h1><section class="card"><input id="file" type="file" accept=".json"><textarea id="text" placeholder="Paste JSON here"></textarea><button id="upload">Load upload</button><button id="paste">Load pasted JSON</button><button id="sample">Load sample</button><button id="download">Download JSON for Git</button><p id="msg"></p></section><section class="card"><h2>Plan</h2><ol id="plan"></ol></section><section id="panel" class="card hidden"><div class="coach"><div><h3 id="phase">Ready</h3><h2 id="name"></h2><div id="timer">00:00</div><p id="detail"></p></div><div id="media"></div></div><button id="start">Start</button><button id="done" class="hidden">Done</button><button id="pause">Pause</button><button id="skip">Skip</button><button id="finish" class="hidden">Finish workout</button></section><section class="card"><h2 id="month"></h2><div id="cal" class="cal"></div></section><script src="app.js"></script></main>
