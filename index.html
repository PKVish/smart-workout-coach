<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Smart Workout Coach</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:16px system-ui}main{max-width:980px;margin:auto;padding:18px}.card{background:#102036;border:1px solid #29425d;border-radius:18px;padding:17px;margin:14px 0}.drop{display:block;border:2px dashed #43d6ff;border-radius:14px;padding:24px;text-align:center;cursor:pointer}.drop input{display:block;width:100%;margin-top:12px}textarea{width:100%;min-height:180px;margin-top:14px;padding:13px;background:#07111f;color:#fff;border:1px solid #38516d;border-radius:10px;font:14px monospace}button{padding:13px 15px;border:0;border-radius:10px;background:#b7f34b;color:#102000;font-weight:800;margin:4px}.secondary{background:#29435f;color:#fff}.coach{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,38%);gap:16px;align-items:center}#timer{font-size:clamp(65px,18vw,135px);font-weight:900;color:#b7f34b;text-align:center}#name,#phase,#detail{text-align:center}#media img,#media video{width:100%;max-height:420px;object-fit:contain;border-radius:14px}.hidden,#media:empty{display:none}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{padding:8px}.completed{background:#b7f34b;color:#07111f;border-radius:8px}.active{background:#19344f;color:#b7f34b;border-radius:8px}@media(max-width:680px){.coach{grid-template-columns:1fr}}</style></head><body><main><h1>Smart Workout Coach</h1><section class="card"><h2>Load workout JSON</h2><label class="drop">Choose or drop a JSON file<input id="jsonFile" type="file" accept="application/json,.json"></label><textarea id="jsonPaste" placeholder="Alternatively, paste the complete JSON here"></textarea><p><button id="loadFile">Load uploaded JSON</button><button id="loadPaste">Load pasted JSON</button><button id="loadSample" class="secondary">Load attached sample</button><button id="downloadGit" class="secondary">Download JSON for Git</button></p><p id="status"></p></section><section class="card"><h2 id="program">Workout plan</h2><p id="summary"></p><ol id="plan"></ol></section><section id="coach" class="card hidden"><div class="coach"><div><h3 id="phase">Ready</h3><h2 id="name"></h2><div id="timer">00:00</div><p id="detail"></p></div><div id="media"></div></div><button id="start">Start</button><button id="done" class="hidden">Done</button><button id="pause" class="secondary">Pause</button><button id="skip" class="secondary">Skip</button><button id="finish" class="hidden">Finish workout</button></section><section class="card"><h2 id="month"></h2><div id="calendar" class="cal"></div></section></main><script src="app.js"></script></body></html>
