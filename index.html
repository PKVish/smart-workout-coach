<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Workout Coach</title><style>body{margin:0;background:#07111f;color:white;font:16px system-ui}main{max-width:900px;margin:auto;padding:18px}.card{background:#102036;border-radius:18px;padding:18px;margin:14px 0}textarea,input{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;background:#07111f;color:white;border:1px solid #456}textarea{min-height:160px}button{padding:12px;margin:4px;border:0;border-radius:10px;font-weight:700;background:#b7f34b}.secondary{background:#29435f;color:white}.danger{background:#ff6678}.hidden{display:none}#timer{font-size:clamp(70px,20vw,140px);text-align:center;color:#b7f34b;font-weight:900}#phase,#name,#detail{text-align:center}.active{background:#19344f;color:#b7f34b}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.complete{background:#b7f34b;color:#07111f;border-radius:8px}</style></head><body><main><h1>Smart Workout Coach</h1><section class="card"><h2>Load JSON</h2><input id="file" type="file" accept="application/json,.json"><textarea id="paste" placeholder="Or paste JSON here"></textarea><button id="load">Load uploaded JSON</button><button id="loadPaste">Load pasted JSON</button><button id="sample" class="secondary">Load sample</button><p id="status"></p></section><section class="card"><h2 id="program">Plan</h2><ol id="plan"></ol></section><section id="coach" class="card hidden"><h3 id="phase"></h3><h2 id="name"></h2><div id="timer">00:00</div><p id="detail"></p><button id="start">Start</button><button id="done" class="hidden">Done</button><button id="pause" class="secondary">Pause</button><button id="reset" class="danger">Reset current</button><button id="skip" class="secondary">Skip</button><button id="finish" class="hidden">Finish workout</button></section><section class="card"><h2 id="month"></h2><div id="calendar" class="cal"></div></section><script src="app.js"></script></main></body></html>
