<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>Smart Workout Coach</title><style>:root{color-scheme:dark;--bg:#050d18;--card:#0e1b2c;--line:#263e59;--text:#f4f8fc;--muted:#9fb0c4;--green:#56d273;--lime:#b7f34b;--blue:#2a425d;--orange:#ff9f43;--red:#ff9aa0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142a42,var(--bg) 46%);color:var(--text);font:15px system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}h1{font-size:clamp(25px,7vw,40px);margin:8px 0}h2{font-size:18px;margin:6px 0 10px}textarea{width:100%;min-height:110px;padding:10px;background:#07111f;color:#fff;border:1px solid #3b526d;border-radius:9px;font:12px monospace}.row{display:grid;gap:6px;margin-top:7px}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}button,.file{border:0;border-radius:9px;padding:11px 6px;background:var(--lime);color:#102000;font-weight:800;text-align:center;cursor:pointer}.file{position:relative;background:var(--blue);color:#fff}.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.secondary{background:var(--blue);color:#fff}.plan-section{background:#081523;border-radius:10px;padding:9px;margin:7px 0}.plan-section h3{font-size:13px;color:#43d6ff;margin:0 0 5px}.plan-section ul{margin:0;padding-left:20px}.plan-section li,.set-label{font-size:11px;font-weight:400;padding:2px}.set{margin:5px 0 5px 8px}.hidden{display:none!important}#timer{text-align:center;font-size:clamp(74px,24vw,140px);line-height:1;font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums}#phase,#name{text-align:center;margin:5px}#exerciseMeta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px auto;max-width:650px;padding:9px 12px;background:#07111f;border-radius:10px}#measure{font-size:21px;font-weight:900;color:#fff}#sequence{font-size:14px;font-weight:700;color:#43d6ff;text-align:right}.done{background:var(--orange)}.start{background:var(--green)}.reset{background:var(--red)}#wakeStatus{text-align:center;color:var(--muted);font-size:11px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:6px 2px}.completed{background:var(--lime);color:#07111f;border-radius:7px}@media(max-width:600px){main{padding:7px}.card{padding:10px;margin:7px 0;border-radius:12px}textarea{min-height:85px}button,.file{padding:10px 3px;font-size:11px}#exerciseMeta{padding:7px 9px}#measure{font-size:18px}#sequence{font-size:12px}.plan-section{padding:7px}.plan-section li{font-size:10px}h1{margin:3px 0}}.json-source-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,38%);gap:8px}.artifact-browser{background:#07111f;border:1px solid #3b526d;border-radius:9px;padding:8px}.artifact-browser label{display:block;font-size:12px;font-weight:800;color:#43d6ff;margin-bottom:5px}.artifact-browser select{width:100%;min-height:110px;background:#07111f;color:#fff;border:1px solid #3b526d;border-radius:7px;font-size:11px;padding:4px}.artifact-browser optgroup{color:#43d6ff}.artifact-browser option{color:#fff;padding:3px}.artifact-browser p{font-size:10px;color:var(--muted);margin:5px 0 0}.exercise-media{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:5px auto 8px;max-width:700px}.exercise-media:empty{display:none}.exercise-media img,.exercise-media video{display:block;max-width:100%;width:auto;max-height:260px;border-radius:10px;background:#02070d;border:1px solid var(--line)}@media(max-width:600px){.json-source-grid{grid-template-columns:1fr 44%}.artifact-browser select{min-height:85px}.exercise-media img,.exercise-media video{max-height:190px}}.pause-resume{background:var(--orange)!important;color:#102000!important}.exercise-media.has-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center}.exercise-media.has-two img,.exercise-media.has-two video{width:100%;height:220px;object-fit:contain}@media(max-width:600px){.exercise-media.has-two img,.exercise-media.has-two video{height:150px}}.completion-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.completion-actions button{width:100%}.start-again{background:var(--green)!important}.workout-controls-hidden{display:none!important}</style></head><body><main><h1>Smart Workout Coach</h1><section class="card"><div class="json-source-grid"><textarea id="json" placeholder="Paste workout JSON"></textarea><div class="artifact-browser"><label for="exerciseFiles">GitHub exercise files</label><select id="exerciseFiles" size="10"><option disabled>Loading artifacts/exercise...</option></select><p id="artifactStatus">Loading repository files...</p></div></div><div class="row three"><button id="planJson">Plan JSON</button><button id="download" class="secondary">Download</button><button id="sample" class="secondary">Sample</button></div><div class="row two"><label class="file">Upload JSON<input id="file" type="file" accept="application/json,.json"></label><button id="planUpload">Plan Upload</button></div><p id="status"></p></section><section class="card"><h2 id="program">Workout Plan</h2><p id="summary"></p><div id="plan"></div></section><section id="coach" class="card hidden"><h3 id="phase"></h3><h2 id="name"></h2><div id="exerciseMedia" class="exercise-media"></div><div id="timer">00:00</div><div id="exerciseMeta"><span id="measure"></span><span id="sequence"></span></div><p id="wakeStatus">Screen awake: inactive</p><p id="voiceStatus">Voice commands inactive. Start the workout to enable the microphone.</p><div id="primaryControls" class="row two"><button id="done" class="done hidden">Done</button><button id="skip" class="secondary">Skip</button></div><div id="secondaryControls" class="row three"><button id="start" class="start">Start</button><button id="pause" class="secondary">Pause</button><button id="reset" class="reset">Reset</button></div><div id="completionActions" class="completion-actions hidden"><button id="finish">Finish</button><button id="startAgain" class="start-again">Start Again</button></div></section><section class="card"><h2 id="month"></h2><div id="calendar" class="cal"></div></section></main><script src="app.js"></script></body></html>
